[package]
name = "pier"
version = "0.9.0"
description = "Dock customizável para Windows, Linux (GNOME e KDE Plasma) e macOS"
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
auto-launch = "0.6"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
dirs = "6"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
rrule = "0.14.0"
tauri-plugin-notification = "2"
sys-locale = "0.3"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "async-io"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
x11rb = { version = "0.13", features = ["xtest"] }
gtk = "0.18"
gdkx11 = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
core-foundation = "0.10"
accessibility-sys = "0.1"
plist = "1"
objc2-core-wlan = "0.3"
objc2-io-bluetooth = "0.3"
objc2-quartz-core = "0.3"
block2 = "0.6"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocationManager"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCScreenshotManager", "SCShareableContent", "SCStream"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGWindow"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# O `#[interface]` do windows-rs gera código que referencia `::windows_core`.
windows-core = "0.58"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Win32_Devices_FunctionDiscovery",
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Foundation_Numerics",
  "Media_Control",
  "Networking_Connectivity",
  "Storage_Streams",
  "System",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WiFi",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
