name: CI

on:
  pull_request:
  # Na main o cache fica disponível para as PRs (o GitHub só deixa uma ref ler o cache dela mesma e
  # o da branch padrão).
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # tsc + vite build
      - run: npm run build
      - run: npm test

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # O Tauri embute o frontend (`frontendDist`) na compilação, então o dist precisa existir.
      - run: npm ci
      - run: npm run build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # A versão e as seções do CHANGELOG só mudam no release, que é feito pelo mantenedor.
  version:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'nahtanpng'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # O checkout de uma PR é o merge dela na main, então HEAD^1 é a main.
      - name: Versão e CHANGELOG sem mudanças de release
        run: |
          status=0
          if [ "$(git show HEAD^1:package.json | jq -r .version)" != "$(jq -r .version package.json)" ]; then
            echo "::error file=package.json::Não altere a versão: ela é definida pelo mantenedor no release."
            status=1
          fi
          cargo_version() { awk -F'"' '/^version = /{print $2; exit}'; }
          if [ "$(git show HEAD^1:src-tauri/Cargo.toml | cargo_version)" != "$(cargo_version < src-tauri/Cargo.toml)" ]; then
            echo "::error file=src-tauri/Cargo.toml::Não altere a versão: ela é definida pelo mantenedor no release."
            status=1
          fi
          for file in CHANGELOG.md CHANGELOG.pt-BR.md; do
            if ! diff <(git show "HEAD^1:$file" | grep -E '^## ') <(grep -E '^## ' "$file") >/dev/null; then
              echo "::error file=$file::Não adicione nem renomeie seções de versão: elas são escritas pelo mantenedor no release."
              status=1
            fi
          done
          exit $status
