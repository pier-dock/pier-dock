name: Release

on:
  push:
    tags: ["v*"]
  # Rodado à mão, só compila e anexa os instaladores à execução, sem criar Release.
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Os testes de UI e o clippy rodam no CI; instalar o Chromium aqui deixava o release lento.
      # A tag só sai se o CI deste mesmo commit passou (espera ele terminar, se ainda estiver rodando).
      - name: CI passou neste commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            status=$(jq -r '.status // empty' <<<"$run")
            if [ "$status" = "completed" ]; then
              conclusion=$(jq -r .conclusion <<<"$run")
              if [ "$conclusion" = "success" ]; then
                echo "CI passou: $(jq -r .url <<<"$run")"
                exit 0
              fi
              echo "::error::O CI deste commit terminou com '$conclusion': $(jq -r .url <<<"$run"). Rode de novo ou corrija antes de publicar."
              exit 1
            fi
            echo "CI ${status:-ainda não começou}, esperando…"
            sleep 30
          done
          echo "::error::O CI deste commit não terminou em 30 minutos."
          exit 1
      - name: Tag igual à versão do package.json
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $version do package.json"
            exit 1
          fi
      # O app mostra estas notas depois de atualizar; sem a seção da versão, a janela não abre.
      # Uma prévia (vX.Y.Z-beta.N) não passa pelo updater e usa as notas da versão final.
      - name: Novidades da versão no changelog
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        run: |
          version=$(node -p "require('./package.json').version")
          for file in CHANGELOG.md CHANGELOG.pt-BR.md; do
            if ! grep -Eq "^## v?$version( |$)" "$file"; then
              echo "::error::Falta a seção '## $version' em $file"
              exit 1
            fi
          done

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
          # A glibc mais antiga deixa o AppImage rodar em mais distros.
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci
      - run: npm run build
      - name: Native tests before packaging
        working-directory: src-tauri
        run: cargo test --locked

      # Com a assinatura ad-hoc, o macOS trata cada versão como um app novo e pede Acessibilidade,
      # Gravação de Tela e Áudio de novo a cada atualização. Um certificado fixo (mesmo autoassinado)
      # mantém a mesma "designated requirement", e as permissões sobrevivem. Sem os secrets, continua ad-hoc.
      #
      # O certificado é importado aqui, e o Tauri recebe só o nome: com APPLE_CERTIFICATE ele mesmo
      # importa, mas depois só aceita certificados confiáveis com nome da Apple ("Developer ID
      # Application: …") e recusa um autoassinado. O codesign assina com ele normalmente.
      - name: Certificado de assinatura do macOS
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$SIGNING_IDENTITY" ]; then
            echo "::warning::Sem APPLE_CERTIFICATE/APPLE_SIGNING_IDENTITY: o app sai com assinatura ad-hoc e as permissões resetam a cada atualização."
            exit 0
          fi
          keychain="$RUNNER_TEMP/pier-signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          certificate="$RUNNER_TEMP/pier-signing.p12"
          echo "$CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$certificate"
          # Sem isto o codesign esperaria uma confirmação na interface para usar a chave.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Pier ${{ github.ref_name }}
          releaseDraft: true
          # O updater lê `releases/latest`, que ignora prereleases: uma prévia só chega a quem baixa.
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}

      # Só para conferir no log: com o certificado, a requirement cita o certificado em vez de um cdhash.
      - name: Assinatura do app
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          app=$(find src-tauri/target -path '*/bundle/macos/*.app' -maxdepth 6 | head -1)
          codesign -dv "$app" 2>&1 | grep -E '^(Authority|Signature|Identifier)'
          codesign -dr - "$app"
